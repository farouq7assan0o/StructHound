[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "structhound"
version = "0.1.0"
description = "Build-resilient parser for Windows forensic artifacts (memory dumps and registry hives)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Farouq Hassan" }]
keywords = ["dfir", "forensics", "windows", "incident-response", "reverse-engineering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: System :: Forensics",
]
dependencies = [
    # Pure standard library, including the native PDB symbol backend. See the optional
    # "pdb" extra below (intentionally empty — the native reader needs no third-party dep).
]

[project.urls]
Homepage = "https://github.com/farouqhassan/structhound"
Issues = "https://github.com/farouqhassan/structhound/issues"

[project.scripts]
structhound = "structhound.cli:main"

[project.optional-dependencies]
dev = ["pytest", "ruff"]
# The native PDB backend (structhound.recover.pdb) is pure standard library, so this
# extra is intentionally empty. It exists as the documented, stable install target for
# PDB support — `pip install structhound[pdb]` — so a future non-stdlib dependency
# (e.g. a symbol-server downloader) can be added here without changing how users opt in.
pdb = []

[tool.setuptools.packages.find]
include = ["structhound*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
